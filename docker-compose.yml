services:
  postgres:
    image: postgres:15-alpine
    container_name: accounts_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounts_db}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - accounts-network

  accounts-service:
    build: .
    container_name: accounts-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_DOCKER:-jdbc:postgresql://postgres:5432/accounts_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    depends_on:
      - postgres
    networks:
      - accounts-network

volumes:
  postgres_data:

networks:
  accounts-network:
    driver: bridge
